name: Deploy to Domeneshop
on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run manually from the Actions tab

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: RidderSider2
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # Not needed on the web server: docs/specs (.info) and SQL migrations (db) are run by hand.
      - name: Remove source-only folders from the upload
        run: rm -rf .info db

      # dev only: browser password popup so the public and Google can't see the unfinished site.
      # Set the secret DEV_HTPASSWD_PATH to the absolute server path of ~/private/dev.htpasswd.
      - name: Protect dev with a password
        env:
          HTPASSWD_PATH: ${{ secrets.DEV_HTPASSWD_PATH }}
        run: |
          if [ -n "$HTPASSWD_PATH" ]; then
            printf '\nAuthType Basic\nAuthName "Arme Riddere dev"\nAuthUserFile %s\nRequire valid-user\n' "$HTPASSWD_PATH" >> .htaccess
          fi

      - name: Mirror repo to server (extras are deleted)
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          lftp --env-password -u "${{ secrets.SFTP_USER }}" sftp://ssh.domeneshop.no -e "
            set cmd:fail-exit yes;
            mirror -R --delete --verbose \
              --exclude-glob .git* \
              --exclude .github/ \
              ./ dev/ ;
            bye"

      - name: Verify server matches repo
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          mkdir /tmp/live
          lftp --env-password -u "${{ secrets.SFTP_USER }}" sftp://ssh.domeneshop.no -e "
            set cmd:fail-exit yes;
            mirror --verbose dev/ /tmp/live ;
            bye"
          diff -r -q --exclude=.git --exclude=.github . /tmp/live