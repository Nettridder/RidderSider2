<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logg inn – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="css/global.css">
<style>
.login { min-height: 100vh; display: grid; grid-template-columns: 24rem 1fr; place-items: center start; padding: 0; background-size: cover; background-position: center; background-attachment: fixed; }
.login__panel { width: 100%; height: 100%; background: var(--color-login-background); border-radius: 0; padding: 2.5rem 2rem; display: flex; flex-direction: column; justify-content: center;}
.login__brand { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 2.5rem; }
.login__brand img { width: 30px; }
.login__brand p { margin: 0; font-family: var(--font-heading); font-size: 1.3rem; }
.login__title { margin: 0 0 1.5rem; font-family: var(--font-heading); font-weight: 350; font-size: 2.4rem; line-height: 1.05; }
.login__form { display: grid; gap: 1rem; background: var(--color-background); border-radius: var(--radius-small); padding: 1.5rem; margin: 0 -0.5rem; }
.login__form .field { margin: 0; }
.login__form .input { background: var(surface--color-); border-color: rgba(255, 255, 255, 0.4); color: var(--color-text); opacity: 0.9;}
.login__form .input::placeholder { color: rgba(255, 255, 255, 0.8); }
/* Light theme: the fields above are white-on-white, so give them a visible border and background */
[data-theme="light"] .login__form .input { background: var(--color-surface); border-color: var(--color-border); opacity: 1; }
[data-theme="light"] .login__form .input::placeholder { color: var(--color-text-faint); }
.login__forgot { justify-self: start; }
</style>
<script defer src="js/global.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="logg-inn">

<main class="login" x-data="loginPage()" :style="backgroundImage && `background-image: url('${backgroundImage}')`">
  <div class="login__panel">
    <div class="login__brand">
      <img src="../images/logoColor.png" alt="">
      <p>Mannskoret Arme Riddere</p>
    </div>
    <h1 class="login__title">Logg inn</h1>

    <form class="login__form" x-show="mode === 'login'" @submit.prevent="logIn()" novalidate>
      <label class="field" for="login-email">E-post
        <input id="login-email" class="input" type="email" autocomplete="username" x-model="email" :aria-invalid="error ? 'true' : null">
      </label>
      <label class="field" for="login-password">Passord
        <input id="login-password" class="input" type="password" autocomplete="current-password" x-model="password">
      </label>
      <p class="field-error" x-show="error" x-text="error"></p>
      <button class="button" type="submit" :disabled="busy">Logg inn</button>
      <button class="text-link login__forgot" type="button" @click="mode = 'forgot'; error = ''">Glemt passord, eller ny bruker?</button>
    </form>

    <form class="login__form" x-show="mode === 'forgot'" x-cloak @submit.prevent="requestReset()" novalidate>
      <p class="hint">Skriv e-posten din, så sender vi en lenke for å velge nytt passord. Nye medlemmer bruker også denne for å lage sitt første passord.</p>
      <label class="field" for="reset-email">E-post
        <input id="reset-email" class="input" type="email" autocomplete="username" x-model="email" :aria-invalid="error ? 'true' : null">
      </label>
      <p class="field-error" x-show="error" x-text="error"></p>
      <p class="hint" x-show="resetMessage" x-text="resetMessage"></p>
      <button class="button" type="submit" :disabled="busy">Send lenke</button>
      <button class="text-link login__forgot" type="button" @click="mode = 'login'; error = ''; resetMessage = ''">Tilbake til innlogging</button>
    </form>
  </div>
</main>

<script>
function loginPage() {
  return {
    mode: 'login',
    email: '',
    password: '',
    error: '',
    resetMessage: '',
    busy: false,
    backgroundImage: '',
    async init() {
      // Already logged in? Go straight on.
      if (await api.get('me.php').then(() => true, () => false)) { location.replace(safeNextUrl()); return; }
      const backgrounds = await api.get('public.php').then(data => data.login_backgrounds, () => []);
      if (backgrounds.length) this.backgroundImage = storageUrl('images/backgrounds/' + backgrounds[Math.floor(Math.random() * backgrounds.length)]);
    },
    async logIn() {
      this.error = '';
      this.busy = true;
      try {
        await api.post('login.php', { email: this.email, password: this.password });
        location.replace(safeNextUrl());
      } catch (error) {
        this.error = error.message;
      } finally {
        this.busy = false;
      }
    },
    async requestReset() {
      this.error = '';
      this.resetMessage = '';
      this.busy = true;
      try {
        this.resetMessage = (await api.post('password-request.php', { email: this.email })).message;
      } catch (error) {
        this.error = error.message;
      } finally {
        this.busy = false;
      }
    },
  };
}
</script>
</body>
</html>
