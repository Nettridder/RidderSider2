<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ var savedTheme = null; try { savedTheme = localStorage.getItem('theme'); } catch (error) {} if (savedTheme === 'light' || (savedTheme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dokumenter – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/documents.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/documents.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="ridderdata/dokumenter">

<main>
  <div class="content" x-data="documentsPage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Arkiv</h1>
        <p class="page-header__intro">Styrereferater, vedtekter og resolusjonar, og lenker til wiki, video og bilder.</p>
      </div>
      <div class="segmented" role="group" aria-label="Vis">
        <button type="button" :aria-pressed="tab === 'documents'" @click="tab = 'documents'">Dokumenter</button>
        <button type="button" :aria-pressed="tab === 'resolutions'" @click="tab = 'resolutions'">Resolusjonar</button>
      </div>
    </div>

    <!-- Other archives (open in a new tab) -->
    <div class="button-row archive-links">
      <a class="button button--secondary" href="/ridderwiki" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#icon-external"/></svg>RidderWiki</a>
      <a class="button button--secondary" href="/ridderwiki/Videoarkiv" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#icon-external"/></svg>Videoarkiv</a>
      <a class="button button--secondary" href="https://armeriddere.smugmug.com" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#icon-external"/></svg>Bildearkiv</a>
    </div>

    <div x-show="tab === 'documents'">
      <div class="document-filters">
        <input class="search-field" type="search" placeholder="Søk i titler" aria-label="Søk i dokumenter" x-model="search">
        <label class="document-filters__sort"><span class="visually-hidden">Sorter</span>
          <select class="input" x-model="sortOrder">
            <option value="newest">Nyeste først</option>
            <option value="oldest">Eldste først</option>
            <option value="title">A–Å</option>
          </select>
        </label>
      </div>
      <ul class="list">
        <template x-for="doc in documents" :key="doc.id">
          <li class="list__row">
            <button class="document-row__open" type="button" @click="$dispatch('open-document', { id: doc.id })">
              <span class="list__title document-row__title" x-text="doc.title"></span>
              <span class="list__meta" x-text="'Lagt ut av ' + app.memberName(app.member(doc.created_by)) + ', ' + format.fullDate(format.parseDate(doc.created_at))"></span>
            </button>
            <span class="badge badge--muted" x-text="fileType(doc)"></span>
          </li>
        </template>
      </ul>
      <p class="empty-state" x-show="!documents.length">Ingen dokumenter passer søket.</p>
    </div>

    <div x-show="tab === 'resolutions'">
      <template x-for="semester in resolutionsBySemester" :key="semester.key">
        <section class="resolution-semester">
          <h2 class="resolution-semester__title" x-text="semester.name"></h2>
          <ul class="list">
            <template x-for="resolution in semester.resolutions" :key="resolution.id">
              <li class="list__row">
                <p class="resolution__text" x-text="resolution.text"></p>
                <a class="text-link" :href="resolution.wiki_url" target="_blank" rel="noopener">Les i RidderWiki</a>
              </li>
            </template>
          </ul>
        </section>
      </template>
      <p class="empty-state" x-show="!resolutionsBySemester.length">Ingen resolusjonar ennå.</p>
    </div>
  </div>
</main>

</body>
</html>
