<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medlemmer – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/members.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/members.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="medlemmer/medlemmer">

<main>
  <div class="content" x-data="membersPage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Medlemmer</h1>
        <p class="page-header__intro" x-text="group === 'active' ? app.activeMembers.length + ' aktive riddere' : app.formerMembers.length + ' tidligere medlemmer (ypp.com.)'"></p>
      </div>
      <input class="search-field" type="search" placeholder="Søk etter navn" aria-label="Søk i medlemmer" x-model="search">
    </div>

    <div class="member-controls">
      <div class="segmented" role="group" aria-label="Vis medlemmer">
        <button type="button" :aria-pressed="group === 'active'" @click="group = 'active'">Aktive <span x-show="group === 'active'" class="count" x-text="app.activeMembers.length"></span></button>
        <button type="button" :aria-pressed="group === 'former'" @click="group = 'former'">Tidligere <span x-show="group === 'former'" class="count" x-text="app.formerMembers.length"></span></button>
      </div>
      <div class="segmented" role="group" aria-label="Visning">
        <button type="button" :aria-pressed="view === 'list'" @click="view = 'list'">Liste</button>
        <button type="button" :aria-pressed="view === 'gallery'" @click="view = 'gallery'">Galleri</button>
      </div>
    </div>

    <table class="members-table" x-show="view === 'list'">
      <thead>
        <tr>
          <th>Navn</th>
          <th>Rolle</th>
          <th>Stemme</th>
          <th>Medlem siden</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="member in members" :key="member.id">
          <tr>
            <td><a class="person" :href="profileHref(member)"><span class="portrait portrait--small"><img :src="app.memberImage(member)" alt="" loading="lazy"></span><span x-text="app.memberName(member)"></span></a></td>
            <td x-text="app.memberSummary(member)"></td>
            <td x-text="LABELS.voices[member.voice_group]"></td>
            <td x-text="memberPeriod(member)"></td>
          </tr>
        </template>
      </tbody>
    </table>

    <ul class="member-gallery" x-show="view === 'gallery'">
      <template x-for="member in members" :key="member.id">
        <li>
          <a class="member-gallery__card" :href="profileHref(member)">
            <span class="portrait member-gallery__portrait"><img :src="app.memberImage(member)" alt="" loading="lazy"></span>
            <span class="member-gallery__name" x-text="app.memberName(member)"></span>
            <span class="member-gallery__details" x-text="LABELS.voices[member.voice_group]"></span>
          </a>
        </li>
      </template>
    </ul>
    <p class="empty-state" x-show="!members.length">Ingen medlemmer passer søket.</p>
  </div>
</main>

</body>
</html>
