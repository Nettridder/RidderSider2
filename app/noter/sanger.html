<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanger – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/songs.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/songs.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/sanger">

<main>
  <div class="content" x-data="songLibraryPage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Sanger</h1>
        <p class="page-header__intro" x-text="app.knownSongCount() + ' av ' + app.visibleSongs.length + ' sanger kan du'"></p>
      </div>
      <input class="search-field" type="search" placeholder="Søk etter sang eller sjanger" aria-label="Søk i sanger" x-model="search">
    </div>

    <div class="song-filters">
      <div class="segmented" role="group" aria-label="Vis sanger etter hvor godt du kan dem">
        <button type="button" :aria-pressed="knowledgeFilter === null" @click="knowledgeFilter = null">Alle <span class="count" x-text="app.visibleSongs.length"></span></button>
        <template x-for="level in KNOWLEDGE_LEVELS" :key="level.value">
          <button type="button" :aria-pressed="knowledgeFilter === level.value" @click="knowledgeFilter = level.value" :aria-label="level.label" :title="level.label">
            <span class="knowledge-dot" :class="'knowledge-dot--' + level.key" aria-hidden="true"></span>
            <span class="count" x-text="countWithKnowledge(level.value)"></span>
          </button>
        </template>
      </div>
      <label class="visually-hidden" for="genre-filter">Sjanger</label>
      <select id="genre-filter" class="input song-filters__genre" x-model.number="genreFilter">
        <option value="0">Alle sjangere</option>
        <template x-for="genre in app.db.genres" :key="genre.id"><option :value="genre.id" x-text="genre.name"></option></template>
      </select>
    </div>

    <div data-piece="song-list"></div>
  </div>
</main>

</body>
</html>
