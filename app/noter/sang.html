<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ var savedTheme = null; try { savedTheme = localStorage.getItem('theme'); } catch (error) {} if (savedTheme === 'light' || (savedTheme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sang – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/songs.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="../js/global.js"></script>
<script defer src="../js/songs.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/sang">

<main>
  <div class="content content--wide" x-data="songPage()">
    <template x-if="!song">
      <div class="access-notice">
        <h1>Fant ikke sangen</h1>
        <p>Sangen finnes ikke, eller den er ikke tilgjengelig for deg.</p>
        <a class="button button--secondary" href="sanger.html">Til Sanger</a>
      </div>
    </template>

    <template x-if="song">
      <div class="song-page">
        <section class="player" :class="(!playerOpen || marker) && 'player--fixed'" aria-label="Lydspiller">
          <!-- Top line of the song view: the song name, centered. The follow toggle and X are in the corner pill. -->
          <div class="player__head">
            <p class="player__title" x-text="song.name"></p>
          </div>
          <template x-if="!tracks.length">
            <div class="player__controls">
              <p class="empty-state player__empty">Ingen lydfiler er lagt ut for denne sangen ennå.</p>
            </div>
          </template>
          <template x-if="tracks.length">
            <div class="player__controls" role="group" aria-label="Lydspiller kontroller">
              <button type="button" class="player__play" @click="togglePlay()" :aria-label="isPlaying ? 'Pause' : 'Spill av'">
                <svg aria-hidden="true"><use :href="isPlaying ? '#icon-pause' : '#icon-play'"/></svg>
              </button>

              <div class="player__timeline">
                <input class="player__seek" type="range" min="0" :max="duration || 0" step="0.1" :value="currentTime" @input="seekTo(Number($event.target.value))" aria-label="Posisjon i sangen"
                       :style="`--progress:${duration ? currentTime / duration * 100 : 0}%`">
                <div class="player__times"><span x-text="format.duration(currentTime)"></span><span x-text="format.duration(duration)"></span></div>
              </div>

              <div class="player__voice-dropdown">
                <div class="player__voice-select" @click.away="showVoiceMenu = false">
                  <button type="button" class="button button--secondary" @click="toggleVoiceMenu()" :aria-label="'Stemme: ' + (selectedTrack ? selectedTrack.name : '')">
                    <span class="player__voice-label" x-text="groupIds ? 'Stemmefiler' : selectedTrack ? selectedTrack.name : 'Stemme'" x-effect="fitVoiceLabel($el, groupIds, selectedTrack)"></span>
                  </button>
                  <!-- The sound files in the order Note Admin set -->
                  <div class="dropdown" x-show="showVoiceMenu">
                    <template x-for="track in tracks" :key="track.id">
                      <button type="button" class="dropdown-item" @click="selectTrack(track); showVoiceMenu = false" :class="!groupIds && selectedTrack === track && 'dropdown-item--active'">
                        <span x-text="track.name"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Tempo: only an icon; the speed list opens on click -->
              <div class="player__speed" @click.away="showSpeedMenu = false">
                <button type="button" class="player__skip" @click="showSpeedMenu = !showSpeedMenu" aria-label="Tempo" aria-haspopup="true" :aria-expanded="showSpeedMenu" title="Tempo">
                  <svg aria-hidden="true"><use href="#icon-tempo"/></svg>
                </button>
                <div class="dropdown dropdown--narrow" x-show="showSpeedMenu" x-cloak>
                  <template x-for="option in SPEED_OPTIONS" :key="option">
                    <button type="button" class="dropdown-item" :class="speed === option && 'dropdown-item--active'" @click="setSpeed(option)" x-text="Math.round(option * 100) + ' %'"></button>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>

        <!-- Always on top of the page, in the empty spot at the right of the player's top line: follow toggle and X (back to the song list) -->
        <div class="player-overlay" :class="playerOpen && !marker && 'player-overlay--following'">
          <template x-if="!marker">
            <div class="player-overlay__group">
              <button type="button" @click="togglePlayer()" :aria-label="playerOpen ? 'Slutt å følge' : 'Fest spilleren'" :title="playerOpen ? 'Slutt å følge' : 'Fest spilleren'"><svg aria-hidden="true"><use :href="playerOpen ? '#icon-up' : '#icon-down'"/></svg></button>
              <a href="sanger.html" aria-label="Tilbake til alle sanger" title="Alle sanger"><svg aria-hidden="true"><use href="#icon-close-bold"/></svg></a>
            </div>
          </template>
          <!-- Drawing mode (experimental): the drawing tools take the place of the toggle and X, so the note view can only be left after the pen is switched off -->
          <template x-if="marker">
            <div class="player-overlay__group">
              <button type="button" aria-pressed="true" @click="marker = false; eraser = false" aria-label="Slå av tegning" title="Slå av tegning"><svg aria-hidden="true"><use href="#icon-marker"/></svg></button>
              <button type="button" :disabled="!historyCount" @click="undoInk()" aria-label="Angre" title="Angre"><svg aria-hidden="true"><use href="#icon-undo"/></svg></button>
              <button type="button" :aria-pressed="eraser" @click="eraser = !eraser" aria-label="Viskelær" title="Viskelær"><svg aria-hidden="true"><use href="#icon-eraser"/></svg></button>
              <button type="button" :disabled="!strokeCount" @click="clearInk()" aria-label="Slett hele tegningen" title="Slett hele tegningen"><svg aria-hidden="true"><use href="#icon-trash"/></svg></button>
            </div>
          </template>
        </div>

        <section class="song-materials" aria-label="Noter, video og tekst">
          <div class="song-materials__bar">
            <div class="segmented song-materials__tabs" role="tablist" aria-label="Innhold">
              <template x-for="tab in tabs" :key="tab.key">
                <button type="button" role="tab" :aria-selected="activeTab === tab.key" :aria-pressed="activeTab === tab.key" @click="activeTab = tab.key" x-text="tab.label"></button>
              </template>
            </div>
            <!-- Right of the tabs, and under them when there is no room: all together as one group -->
            <div class="song-materials__tools">
            <!-- How well you know the song and the star (favorite): on every tab. After them the PDF icons (icons only, Noter tab). -->
            <div class="song-materials__rating">
              <div class="knowledge-picker" role="group" aria-label="Hvor godt kan du sangen">
                <template x-for="level in KNOWLEDGE_LEVELS" :key="level.value">
                  <button type="button" :aria-pressed="app.knowledgeOf(song.id) === level.value" @click="app.setKnowledge(song.id, level.value)" :aria-label="level.label" :title="level.label">
                    <span class="knowledge-dot" :class="'knowledge-dot--' + level.key"></span>
                  </button>
                </template>
              </div>
              <button class="favorite-button" type="button" :aria-pressed="app.isFavorite(song.id)" @click="app.toggleFavorite(song.id)" :aria-label="app.isFavorite(song.id) ? 'Fjern fra favoritter' : 'Legg til i favoritter'" :title="app.isFavorite(song.id) ? 'Fjern fra favoritter' : 'Legg til i favoritter'">
                <svg aria-hidden="true"><use :href="app.isFavorite(song.id) ? '#icon-star-fill' : '#icon-star'"/></svg>
              </button>
            </div>
            <div class="song-materials__actions" x-show="activeTab === 'sheet' && sheetUrl">
              <!-- Marker (experimental): draw on the notes in blue. One finger or the mouse draws, two fingers scroll. Saved on your user. -->
              <button type="button" class="icon-button" :aria-pressed="marker" @click="marker = !marker; if (!marker) eraser = false" aria-label="Markør: tegn på notene" title="Markør: tegn på notene"><svg aria-hidden="true"><use href="#icon-marker"/></svg></button>
              <a class="icon-button" :href="sheetUrl" target="_blank" rel="noopener" aria-label="Åpne i ny fane" title="Åpne i ny fane"><svg aria-hidden="true"><use href="#icon-external"/></svg></a>
              <a class="icon-button" :href="sheetUrl" download aria-label="Last ned PDF" title="Last ned PDF"><svg aria-hidden="true"><use href="#icon-download"/></svg></a>
            </div>
            </div>
          </div>

          <div x-show="activeTab === 'sheet'" role="tabpanel">
            <template x-if="sheetUrl">
              <div class="sheet-viewer">
                <div class="sheet-pages" id="sheet-pages" :class="marker && 'marker-on'"></div>
              </div>
            </template>
            <p class="empty-state" x-show="!sheetUrl">Notene er ikke lagt ut ennå.</p>
          </div>

          <div x-show="activeTab === 'video'" role="tabpanel">
            <template x-if="youtubeId">
              <div class="video-frame"><iframe :src="'https://www.youtube-nocookie.com/embed/' + youtubeId" :title="'Koreografi for ' + song.name" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
            </template>
            <template x-if="videoFileUrl">
              <video class="video-frame" controls preload="metadata" :src="videoFileUrl"></video>
            </template>
            <p class="empty-state" x-show="!song.choreography_url">Ingen koreografivideo for denne sangen.</p>
          </div>

          <div x-show="activeTab === 'lyrics'" role="tabpanel">
            <p class="lyrics" x-show="song.lyrics" x-text="song.lyrics"></p>
            <p class="empty-state" x-show="!song.lyrics">Teksten er ikke lagt inn ennå.</p>
          </div>

          <div x-show="activeTab === 'voices'" role="tabpanel">
            <div class="voice-files__play">
              <button type="button" class="button" @click="playChosen()">
                <svg aria-hidden="true"><use :href="groupIds && isPlaying ? '#icon-pause' : '#icon-play'"/></svg><span x-text="groupIds && isPlaying ? 'Pause' : chosenIds.length ? 'Spill valgte (' + chosenIds.length + ')' : 'Spill alle'"></span>
              </button>
              <button type="button" class="text-link" x-show="chosenIds.length" @click="chosenIds = []">Fjern valg</button>
            </div>
            <ul class="voice-files">
              <template x-for="track in tracks" :key="track.id">
                <li class="voice-files__row">
                  <label class="voice-files__choice"><input type="checkbox" :value="track.id" x-model.number="chosenIds" :aria-label="'Velg ' + track.name"><span class="voice-files__name" x-text="track.name"></span></label>
                  <a class="button button--secondary button--small" :href="track.url" :download="track.downloadName"><svg aria-hidden="true"><use href="#icon-download"/></svg>Last ned</a>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </div>
    </template>
  </div>
</main>

</body>
</html>
