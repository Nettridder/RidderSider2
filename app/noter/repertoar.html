<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repertoar – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/songs.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/songs.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/repertoar">

<main>
  <div class="content" x-data="repertoirePage()">
    <template x-if="!repertoire">
      <div class="empty-repertoire">
        <h1 class="page-header__title" tabindex="-1">Ingen repertoar ennå</h1>
        <p>Når noteansvarlig legger ut et repertoar, finner du sangene og rekkefølgen her. Til da kan du øve på sangene i Sanger.</p>
        <div class="button-row">
          <a class="button button--secondary" href="sanger.html">Gå til Sanger</a>
          <a class="text-link" x-show="app.hasRole('notes')" href="admin/repertoar.html">Opprett et repertoar</a>
        </div>
      </div>
    </template>

    <template x-if="repertoire">
      <div>
        <div class="page-header">
          <div>
            <h1 class="page-header__title" tabindex="-1"><span x-text="repertoire.name"></span> <span class="badge badge--muted" x-show="!repertoire.is_visible">Utkast</span></h1>
            <p class="page-header__intro" x-text="songs.length + ' sanger i konsertrekkefølge. Fargen viser hvor godt du kan sangen.'"></p>
          </div>
        </div>
        <div data-piece="song-list"></div>
        <p class="hint repertoire-hint">Endre hvor godt du kan en sang i <a class="text-link" href="sanger.html">sangvisningen</a>.</p>
      </div>
    </template>
  </div>
</main>

</body>
</html>
