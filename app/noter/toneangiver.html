<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toneangiver – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/songs.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/songs.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/toneangiver">

<main>
  <div class="content" x-data="pitchPipePage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Toneangiver</h1>
        <p class="page-header__intro">Trykk på sangen for å høre alle starttonene, eller på én tone.</p>
      </div>
      <input class="search-field" type="search" placeholder="Søk etter sang" aria-label="Søk i toneangiver" x-model="search">
    </div>
    <ul class="list pitch-list">
      <template x-for="song in songs" :key="song.id">
        <li class="list__row pitch-list__row" :class="playingSongId === song.id && 'is-playing'">
          <button type="button" class="pitch-list__song" @click="playNotes(song.id, app.songStartNotes(song.id))"
                  :aria-label="'Spill starttonene for ' + song.name">
            <span class="pitch-list__play" aria-hidden="true"><svg><use href="#icon-play"/></svg></span>
            <span class="list__title"><span x-text="song.name"></span><span class="sound-bars" x-show="playingSongId === song.id" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="list__meta" x-text="playingSongId === song.id ? 'Spiller' : app.songGenreNames(song.id)"></span></span>
          </button>
          <div class="start-notes pitch-list__notes">
            <template x-for="(note, index) in app.songStartNotes(song.id)" :key="note.id">
              <button type="button" class="start-note" :class="isPlayingNote(song.id, index) && 'is-playing'" @click="playNote(song.id, app.songStartNotes(song.id), index)"
                      :aria-label="'Spill ' + (note.voice ? LABELS.voices[note.voice] : 'tutti') + ', ' + note.start_note">
                <span class="start-note__voice" x-text="note.voice || 'Tutti'"></span>
                <span class="start-note__pitch"><span x-text="noteParts(note.start_note).letter"></span><span class="start-note__accidental" x-show="noteParts(note.start_note).accidental" x-text="noteParts(note.start_note).accidental"></span><span x-text="noteParts(note.start_note).octave"></span></span>
              </button>
            </template>
          </div>
        </li>
      </template>
    </ul>
    <p class="empty-state" x-show="!songs.length">Ingen sanger passer søket.</p>
    <p class="visually-hidden" aria-live="polite" x-text="playingSongId ? 'Spiller ' + app.song(playingSongId).name : ''"></p>
  </div>
</main>

</body>
</html>
