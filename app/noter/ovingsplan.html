<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Øvingsplan – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/songs.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/songs.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/ovingsplan">

<main>
  <div class="content" x-data="practicePlanPage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Øvingsplan</h1>
        <p class="page-header__intro">Kommende øvinger og hva vi skal jobbe med.</p>
      </div>
    </div>
    <ul class="practice-plan">
      <template x-for="(plan, index) in upcomingPlans" :key="plan.id">
        <li class="practice-plan__item" :class="index === 0 && 'practice-plan__item--next'">
          <p class="practice-plan__date"><span x-text="format.longDate(format.parseDate(plan.date))"></span> <span class="practice-plan__time" x-text="startTime(plan)"></span></p>
          <p class="practice-plan__title" x-text="plan.title"></p>
          <p class="practice-plan__description" x-show="plan.description" x-text="plan.description"></p>
        </li>
      </template>
    </ul>
    <p class="empty-state" x-show="!upcomingPlans.length">Ingen øvinger er lagt inn fremover.</p>
  </div>
</main>

</body>
</html>
