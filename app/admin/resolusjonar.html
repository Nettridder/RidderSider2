<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin: Resolusjonar – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/documents.css">
<script defer src="../js/global.js"></script>
<script defer src="../js/documents.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="admin/resolusjonar">

<main>
  <div class="content content--wide" x-data="adminResolutionsPage()">
    <div class="page-header">
      <div>
        <h1 class="page-header__title" tabindex="-1">Resolusjonar</h1>
        <p class="page-header__intro">Resolusjoner vedtatt på generalforsamlingen. Hver har år, semester, teksten og en lenke til RidderWiki.</p>
      </div>
    </div>

    <form class="admin-form" @submit.prevent="addResolution()" novalidate aria-labelledby="add-resolution-title">
      <h2 id="add-resolution-title" class="section-title">Ny resolusjon</h2>
      <div data-form-template="template-resolution:newResolution:new"></div>
      <div class="admin-form__actions">
        <button class="button" type="submit">Legg til resolusjon</button>
      </div>
    </form>

    <div class="admin-list-header">
      <div>
        <h2 class="section-title">Alle resolusjoner</h2>
        <p class="hint" x-text="db.resolutions.length + ' resolusjoner, nyeste semester først'"></p>
      </div>
      <input class="search-field" type="search" placeholder="Søk i teksten" aria-label="Søk i resolusjoner" x-model="search">
    </div>

    <template x-for="group in semesterGroups" :key="group.key">
      <section class="resolution-group" :aria-label="group.label">
        <h3 class="resolution-group__title" x-text="group.label"></h3>
        <ul class="admin-list">
          <template x-for="resolution in group.resolutions" :key="resolution.id">
            <li class="admin-list__row resolution-row">
              <span class="resolution-row__text">
                <span x-text="resolution.text"></span>
                <a class="text-link resolution-row__link" :href="resolution.wiki_url" target="_blank" rel="noopener">Les i RidderWiki</a>
              </span>
              <span class="admin-list__actions" x-show="confirmingDeleteId !== resolution.id">
                <button class="button button--secondary button--small" type="button" @click="editResolution(resolution, $event)">Rediger</button>
                <button class="button button--danger button--small" type="button" @click="confirmingDeleteId = resolution.id">Slett</button>
              </span>
              <span class="admin-list__confirm" x-show="confirmingDeleteId === resolution.id">
                <span>Slette resolusjonen?</span>
                <button class="button button--danger-filled button--small" type="button" @click="deleteResolution(resolution)">Ja, slett</button>
                <button class="button button--secondary button--small" type="button" @click="confirmingDeleteId = null">Avbryt</button>
              </span>
            </li>
          </template>
        </ul>
      </section>
    </template>
    <p class="empty-state" x-show="!semesterGroups.length">Ingen resolusjoner passer søket.</p>

    <div data-edit-drawer>
      <form @submit.prevent="saveResolution()" novalidate>
        <div class="drawer__body"><div data-form-template="template-resolution:editedResolution:edit"></div></div>
        <div class="drawer__footer">
          <button class="button" type="submit">Lagre endringer</button>
          <button class="button button--secondary" type="button" @click="closeDrawer()">Avbryt</button>
        </div>
      </form>
    </div>
  </div>
</main>

<template id="template-resolution">
  <div class="form-grid">
    <label class="field" for="ID-year">År
      <input id="ID-year" class="input" type="number" inputmode="numeric" min="1990" max="2035" x-model.number="FORM.year" :aria-invalid="FORM.submitted && !!resolutionErrors(FORM).year">
      <span class="field-error" x-show="FORM.submitted && resolutionErrors(FORM).year" x-text="resolutionErrors(FORM).year"></span>
    </label>
    <fieldset class="field">
      <legend>Semester</legend>
      <div class="segmented" role="group" aria-label="Semester">
        <button type="button" :aria-pressed="FORM.term === 'spring'" @click="FORM.term = 'spring'">Vår</button>
        <button type="button" :aria-pressed="FORM.term === 'autumn'" @click="FORM.term = 'autumn'">Høst</button>
      </div>
    </fieldset>
    <label class="field form-grid__full" for="ID-text">Resolusjon
      <textarea id="ID-text" class="input" rows="4" x-model="FORM.text" placeholder="Skriv resolusjonen slik den ble vedtatt" :aria-invalid="FORM.submitted && !!resolutionErrors(FORM).text"></textarea>
      <span class="field-error" x-show="FORM.submitted && resolutionErrors(FORM).text" x-text="resolutionErrors(FORM).text"></span>
    </label>
    <label class="field form-grid__full" for="ID-wiki">Lenke til RidderWiki
      <input id="ID-wiki" class="input" type="text" placeholder="/ridderwiki/Resolusjon_H26_1" x-model="FORM.wiki_url" :aria-invalid="FORM.submitted && !!resolutionErrors(FORM).wiki_url">
      <span class="field-error" x-show="FORM.submitted && resolutionErrors(FORM).wiki_url" x-text="resolutionErrors(FORM).wiki_url"></span>
    </label>
  </div>
</template>

</body>
</html>
