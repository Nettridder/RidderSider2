<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<script>/* theme before anything is drawn, so light mode doesn't flash dark (see THEME in js/global.js) */ try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Nytt passord – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="css/global.css">
<style>
.new-password { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.new-password__form { width: min(100%, 24rem); display: grid; gap: 1rem; background: var(--color-surface); border-radius: var(--radius-small); padding: 1.5rem; }
.new-password__form .field { margin: 0; }
.new-password__title { margin: 0; font-family: var(--font-heading); font-weight: 350; font-size: 2rem; }
</style>
<script defer src="js/global.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="nytt-passord">

<!-- Opened from the link in the "Sett nytt passord" email: nytt-passord.html?token=... -->
<main class="new-password" x-data="newPasswordPage()">
  <form class="new-password__form" @submit.prevent="save()" novalidate>
    <h1 class="new-password__title">Velg nytt passord</h1>
    <template x-if="!token">
      <p class="field-error">Lenken mangler kode. Åpne lenken fra e-posten på nytt, eller <a href="logg-inn.html">be om en ny lenke</a>.</p>
    </template>
    <label class="field" for="new-password">Nytt passord (minst 8 tegn)
      <input id="new-password" class="input" type="password" autocomplete="new-password" minlength="8" x-model="password" :aria-invalid="error ? 'true' : null">
    </label>
    <label class="field" for="repeat-password">Gjenta passordet
      <input id="repeat-password" class="input" type="password" autocomplete="new-password" x-model="repeat">
    </label>
    <p class="field-error" x-show="error" x-text="error"></p>
    <button class="button" type="submit" :disabled="busy || !token">Lagre passord og logg inn</button>
    <a class="text-link" href="logg-inn.html">Til innlogging</a>
  </form>
</main>

<script>
function newPasswordPage() {
  return {
    token: new URLSearchParams(location.search).get('token') || '',
    password: '',
    repeat: '',
    error: '',
    busy: false,
    async save() {
      this.error = '';
      if (this.password.length < 8) { this.error = 'Passordet må ha minst 8 tegn.'; return; }
      if (this.password !== this.repeat) { this.error = 'Passordene er ikke like.'; return; }
      this.busy = true;
      try {
        await api.post('password-reset.php', { token: this.token, password: this.password });
        location.replace('index.html');
      } catch (error) {
        this.error = error.message;
      } finally {
        this.busy = false;
      }
    },
  };
}
</script>
</body>
</html>
