<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanger – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../felles/global.css">
<link rel="stylesheet" href="sanger.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="noter/sanger">

<main class="page" x-data="sanger()">
  <div class="inner body">
    <div class="body-h">
      <div>
        <h1 tabindex="-1">Sanger</h1>
        <p x-text="known + ' av ' + A.visibleSongs.length + ' kan du'"></p>
      </div>
      <input class="search" type="search" placeholder="Søk etter sang eller sjanger" aria-label="Søk i sanger" x-model="q">
    </div>
    <ul class="rows songs">
      <template x-for="s in list" :key="s.id">
        <li>
          <a class="nm" :href="'/app/noter/sang/' + s.id"><span x-text="s.t"></span><small x-text="s.g.join(', ')"></small></a>
          <div class="aside">
            <div class="know" role="group" :aria-label="'Hvor godt kan du ' + s.t">
              <template x-for="o in RD.KNOW" :key="o.v">
                <button type="button" :class="'k-'+o.v" :aria-pressed="s.k===o.v" @click="s.k=o.v"><span class="pip" aria-hidden="true"></span><span x-text="o.t"></span></button>
              </template>
            </div>
          </div>
        </li>
      </template>
    </ul>
    <p class="empty" x-show="!list.length">Ingen sanger passer søket. Prøv et kortere ord.</p>
  </div>
</main>

<script src="../felles/data.js"></script>
<script src="../felles/meny.js"></script>
<script>
function sanger(){
  return {
    q:'',
    get A(){ return this.$store.app },
    get known(){ return this.A.visibleSongs.filter(s => s.k==='kjent').length },
    get list(){
      const q = this.q.trim().toLowerCase();
      return this.A.visibleSongs.filter(s => !q || (s.t+' '+s.g.join(' ')).toLowerCase().includes(q));
    },
  };
}
</script>
</body>
</html>
