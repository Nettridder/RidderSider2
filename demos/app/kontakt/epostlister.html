<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epostlister – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../felles/global.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="kontakt/epostlister">

<main class="page" x-data="{lists:[
    {t:'Hele koret', d:'Beskjeder til alle aktive', on:true},
    {t:'Tenorer', d:'Stemmegruppe', on:true},
    {t:'Konsertnytt', d:'Åpne konserter og billetter', on:false, all:true},
    {t:'Ypp.com.', d:'Tidligere medlemmer', on:false, all:true}]}">
  <div class="inner body">
    <div class="body-h"><div><h1 tabindex="-1">Epostlister</h1><p>Velg hvilke lister du får e-post fra.</p></div></div>
    <ul class="rows">
      <template x-for="l in lists.filter(l => $store.app.status==='aktiv' || l.all)" :key="l.t">
        <li>
          <span class="nm"><span x-text="l.t"></span><small x-text="l.d"></small></span>
          <label class="toggle"><input type="checkbox" x-model="l.on"><span class="sw" aria-hidden="true"></span><span x-text="l.on ? 'Abonnerer' : 'Av'"></span><span class="sr" x-text="l.t"></span></label>
        </li>
      </template>
    </ul>
  </div>
</main>

<script src="../felles/data.js"></script>
<script src="../felles/meny.js"></script>
</body>
</html>
