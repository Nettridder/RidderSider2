<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin: Medlemmer – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../../felles/global.css">
<link rel="stylesheet" href="../../felles/admin.css">
<style>
  /* list columns for this page */
  .alist.mems{--cols:32px minmax(0,1.5fr) 5.2rem minmax(0,1fr) 5.2rem 7rem auto;--cols-narrow:32px minmax(0,1fr) auto}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="medlemmer/admin/medlemmer">

<main class="page" x-data="adminMedlemmer()">
  <div class="inner body wide">
    <div class="body-h"><div><h1 tabindex="-1">Administrer medlemmer</h1><p>Legg til nye riddere, og endre stemme, rang, status og roller.</p></div></div>
    <p class="flash" aria-live="polite" x-text="flash"></p>

    <form class="adm-add" @submit.prevent="create()" novalidate aria-labelledby="add-h">
      <h2 id="add-h">Legg til medlem</h2>
      <div data-use="tpl-mem:nyM:ny"></div>
      <p class="hint" style="margin-top:1rem">Medlemmet får en invitasjon på e-post og velger passord selv. Lenken gjelder i 7 dager.</p>
      <div class="factions">
        <button class="btn" type="submit">Legg til og send invitasjon</button>
        <button class="btn btn-quiet" type="button" @click="nyM = blank()">Tøm skjemaet</button>
      </div>
    </form>

    <div class="adm-list-h">
      <div><h2>Alle medlemmer</h2><p x-text="A.members.filter(m => m.status==='active').length + ' aktive, ' + A.members.filter(m => m.status==='former').length + ' ypp.com.'"></p></div>
      <input class="search" type="search" placeholder="Søk etter navn eller e-post" aria-label="Søk i medlemmer" x-model="q">
    </div>
    <ul class="alist mems fold">
      <li class="hd" aria-hidden="true"><span></span><span>Navn</span><span>Stemme</span><span>Rang</span><span>Status</span><span>Roller</span><span></span></li>
      <template x-for="m in list" :key="m.id">
        <li>
          <span class="portrait thumb"><img :src="RD.img.portrait" alt=""></span>
          <span class="an"><span x-text="m.fn + ' ' + m.ln"></span>
            <small x-text="m.email"></small>
            <small class="m-meta" x-text="summary(m)"></small></span>
          <span class="ac wide-only" x-text="RD.voiceName(m.voice)"></span>
          <span class="ac wide-only" x-text="RD.rankName(m.rank)"></span>
          <span class="wide-only"><span class="tag" :class="m.status==='active' ? 'ok' : 'q'" x-text="m.status==='active' ? 'Aktiv' : 'ypp.com.'"></span></span>
          <span class="roles wide-only"><template x-for="r in m.roles" :key="r"><span class="tag" x-text="RD.roleName(r)"></span></template></span>
          <span class="acts"><button class="btn btn-quiet btn-s" type="button" @click="edit(m, $event)" :aria-label="'Rediger ' + m.fn + ' ' + m.ln">Rediger</button></span>
        </li>
      </template>
    </ul>
    <p class="empty" x-show="!list.length">Ingen medlemmer passer søket.</p>
  </div>

  <div data-drawer>
    <form @submit.prevent="save()" novalidate>
      <div class="dp-body"><div data-use="tpl-mem:redM:red"></div></div>
      <div class="dp-f">
        <div class="grp spread" x-show="!confirmDel">
          <button class="btn" type="submit">Lagre endringer</button>
          <button class="btn btn-danger" type="button" @click="confirmDel=true">Fjern medlem</button>
        </div>
        <div class="grp" x-show="confirmDel">
          <span class="ask" x-text="'Fjerne ' + redM.fn + ' ' + redM.ln + ' fra medlemslista?'"></span>
          <button class="btn btn-danger solid btn-s" type="button" @click="remove()">Ja, fjern</button>
          <button class="btn btn-quiet btn-s" type="button" @click="confirmDel=false">Avbryt</button>
        </div>
      </div>
    </form>
  </div>
</main>

<!-- one member form, used for "Legg til" and for "Rediger" -->
<template id="tpl-mem">
  <div class="fgrid">
    <label class="f" for="__P__-fn">Fornavn
      <input id="__P__-fn" class="fld" type="text" autocomplete="off" x-model="__F__.fn" :aria-invalid="__F__.tried && !!err(__F__).fn">
      <span class="err" x-show="__F__.tried && err(__F__).fn" x-text="err(__F__).fn"></span>
    </label>
    <label class="f" for="__P__-ln">Etternavn
      <input id="__P__-ln" class="fld" type="text" autocomplete="off" x-model="__F__.ln" :aria-invalid="__F__.tried && !!err(__F__).ln">
      <span class="err" x-show="__F__.tried && err(__F__).ln" x-text="err(__F__).ln"></span>
    </label>
    <label class="f" for="__P__-em">E-post
      <input id="__P__-em" class="fld" type="email" autocomplete="off" x-model="__F__.email" placeholder="navn@example.no" :aria-invalid="__F__.tried && !!err(__F__).email">
      <span class="err" x-show="__F__.tried && err(__F__).email" x-text="err(__F__).email"></span>
    </label>
    <label class="f" for="__P__-ph">Telefon
      <input id="__P__-ph" class="fld" type="tel" autocomplete="off" x-model="__F__.phone" placeholder="+47 912 34 567">
    </label>
    <fieldset class="f">
      <legend>Stemmegruppe</legend>
      <div class="seg" role="group" aria-label="Stemmegruppe">
        <template x-for="v in ['T1','T2','B1','B2']" :key="v">
          <button type="button" :aria-pressed="__F__.voice===v" @click="__F__.voice=v" :title="RD.voiceName(v)" x-text="v"></button>
        </template>
      </div>
    </fieldset>
    <label class="f" for="__P__-rk">Rang
      <select id="__P__-rk" class="fld" x-model="__F__.rank">
        <template x-for="r in RD.RANKS" :key="r.k"><option :value="r.k" x-text="r.t" :selected="r.k===__F__.rank"></option></template>
      </select>
    </label>
    <fieldset class="f">
      <legend>Status</legend>
      <div class="seg" role="group" aria-label="Status">
        <button type="button" :aria-pressed="__F__.status==='active'" @click="__F__.status='active'">Aktiv</button>
        <button type="button" :aria-pressed="__F__.status==='former'" @click="__F__.status='former'">ypp.com.</button>
      </div>
    </fieldset>
    <fieldset class="f">
      <legend>Begynte</legend>
      <div class="pair">
        <label class="sr" for="__P__-jt">Semester</label>
        <select id="__P__-jt" class="fld" x-model="__F__.jt"><option value="V">Vår</option><option value="H">Høst</option></select>
        <label class="sr" for="__P__-jy">År</label>
        <input id="__P__-jy" class="fld" type="number" inputmode="numeric" min="1950" max="2030" x-model.number="__F__.jy" :aria-invalid="__F__.tried && !!err(__F__).jy">
      </div>
      <span class="err" x-show="__F__.tried && err(__F__).jy" x-text="err(__F__).jy"></span>
    </fieldset>
    <fieldset class="f span2" x-show="__F__.status==='former'">
      <legend>Sluttet (påkrevd for ypp.com.)</legend>
      <div class="pair" style="max-width:17rem">
        <label class="sr" for="__P__-lt">Semester</label>
        <select id="__P__-lt" class="fld" x-model="__F__.lt" :aria-invalid="__F__.tried && !!err(__F__).left"><option value="">Velg</option><option value="V">Vår</option><option value="H">Høst</option></select>
        <label class="sr" for="__P__-ly">År</label>
        <input id="__P__-ly" class="fld" type="number" inputmode="numeric" min="1950" max="2030" placeholder="År" x-model="__F__.ly" :aria-invalid="__F__.tried && !!err(__F__).left">
      </div>
      <span class="err" x-show="__F__.tried && err(__F__).left" x-text="err(__F__).left"></span>
    </fieldset>
    <fieldset class="f span2">
      <legend>Roller</legend>
      <div class="checks">
        <label class="check"><input type="checkbox" value="master" x-model="__F__.roles"> Mester <small>alt av admin</small></label>
        <label class="check"><input type="checkbox" value="notes" x-model="__F__.roles"> Note <small>sanger og repertoar</small></label>
      </div>
    </fieldset>
  </div>
</template>

<script src="../../felles/data.js"></script>
<script src="../../felles/meny.js"></script>
<script src="../../felles/admin.js"></script>
<script>
function adminMedlemmer(){
  return {
    ...adminBase(),
    nyM:null, redM:null,
    init(){ this.nyM = this.blank(); this.redM = this.blank(); },
    get A(){ return this.$store.app },
    get list(){
      const q = this.q.trim().toLowerCase();
      return this.A.members.filter(m => !q || (m.fn+' '+m.ln+' '+m.email).toLowerCase().includes(q));
    },
    get drawerTitle(){ return 'Rediger medlem' },
    get drawerSub(){ const m = this.A.members.find(m => m.id===(this.redM && this.redM.id)); return m ? m.fn+' '+m.ln : '' },
    summary(m){ return RD.voiceName(m.voice) + ', ' + RD.rankName(m.rank) + (m.status==='former' ? ', ypp.com.' : '') + (m.roles.length ? ', ' + m.roles.map(RD.roleName).join(' og ') : '') },
    blank(){ return {id:null, fn:'', ln:'', email:'', phone:'', voice:'T1', rank:'aspirant', status:'active', jt:'H', jy:2026, lt:'', ly:'', roles:[], tried:false} },
    err(F){
      const e = {};
      if(!F.fn.trim()) e.fn = 'Skriv inn fornavn.';
      if(!F.ln.trim()) e.ln = 'Skriv inn etternavn.';
      if(!/^\S+@\S+\.\S+$/.test(F.email.trim())) e.email = 'Skriv inn en gyldig e-postadresse.';
      if(!(+F.jy >= 1950 && +F.jy <= 2030)) e.jy = 'Skriv inn året medlemmet begynte.';
      if(F.status==='former' && (!F.lt || !(+F.ly >= 1950 && +F.ly <= 2030))) e.left = 'Velg semester og år medlemmet sluttet. Det må med når status er ypp.com.';
      return e;
    },
    pick(F){ return {fn:F.fn.trim(), ln:F.ln.trim(), email:F.email.trim(), phone:F.phone.trim(), voice:F.voice, rank:F.rank, status:F.status,
      jt:F.jt, jy:+F.jy, lt:F.status==='former' ? F.lt : '', ly:F.status==='former' ? +F.ly : '', roles:[...F.roles]} },
    create(){
      const F = this.nyM; F.tried = true;
      if(Object.keys(this.err(F)).length){ this.focusFirstInvalid(); return; }
      const id = Math.max(0, ...this.A.members.map(m => m.id)) + 1;
      this.A.members.push({id, ...this.pick(F)});
      this.nyM = this.blank();
      this.say(`${F.fn.trim()} ${F.ln.trim()} er lagt til. Invitasjonen er sendt til ${F.email.trim()}.`);
    },
    edit(m, e){ this.redM = {...m, roles:[...m.roles], tried:false}; this.openDrawer('mem', e); },
    save(){
      const F = this.redM; F.tried = true;
      if(Object.keys(this.err(F)).length){ this.focusFirstInvalid(); return; }
      const m = this.A.members.find(m => m.id===F.id);
      Object.assign(m, this.pick(F));
      // editing yourself also changes the demo user
      if(m.id===1){ this.A.roles = [...m.roles]; this.A.status = m.status==='active' ? 'aktiv' : 'tidligere'; }
      this.closeDrawer(); this.say(`Endringene for ${m.fn} ${m.ln} er lagret.`);
    },
    remove(){
      const m = this.A.members.find(m => m.id===this.redM.id);
      this.A.members = this.A.members.filter(x => x.id!==m.id);
      this.closeDrawer(false); this.say(`${m.fn} ${m.ln} er fjernet fra medlemslista.`); this.focusHeading();
    },
  };
}
</script>
</body>
</html>
