<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medlemmer – Mannskoret Arme Riddere</title>
<link rel="stylesheet" href="../felles/global.css">
<link rel="stylesheet" href="medlemmer.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body data-page="medlemmer/medlemmer">

<main class="page" x-data="{view:'list', get list(){ return $store.app.members.filter(m => m.status==='active') }}">
  <div class="inner body">
    <div class="body-h">
      <div><h1 tabindex="-1">Medlemmer</h1><p x-text="list.length + ' aktive riddere'"></p></div>
      <div class="seg" role="group" aria-label="Visning">
        <button type="button" :aria-pressed="view==='list'" @click="view='list'">Liste</button>
        <button type="button" :aria-pressed="view==='gallery'" @click="view='gallery'">Galleri</button>
      </div>
    </div>
    <ul class="rows mlist" x-show="view==='list'">
      <template x-for="m in list" :key="m.id">
        <li><span class="who"><span class="portrait thumb"><img :src="RD.img.portrait" alt=""></span><span class="nm"><span x-text="m.fn+' '+m.ln"></span><small x-text="RD.voiceName(m.voice)"></small></span></span><span class="aside" x-text="'Siden ' + m.jy"></span></li>
      </template>
    </ul>
    <ul class="gallery" x-show="view==='gallery'">
      <template x-for="m in list" :key="m.id">
        <li><span class="portrait"><img :src="RD.img.portrait" alt=""></span><b x-text="m.fn+' '+m.ln"></b><small x-text="RD.voiceName(m.voice)"></small></li>
      </template>
    </ul>
  </div>
</main>

<script src="../felles/data.js"></script>
<script src="../felles/meny.js"></script>
</body>
</html>
