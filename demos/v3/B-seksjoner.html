<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seksjoner – Armé Riddere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<style>
  :root{
    --bg:#1d1e20;          /* graphite */
    --bg-2:#25272a;        /* raised iron */
    --bg-3:#2d3034;
    --line:#35383d;
    --line-soft:#2b2d31;
    --ink:#efe8dc;         /* bone */
    --dim:#b3ab9f;
    --faint:#7d776e;
    --ember:#ec6c00;
    --ember-hot:#ff8a2b;
    --ember-soft:rgba(236,108,0,.13);
    --r-s:6px;
    --r-m:10px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --serif:"Newsreader", Georgia, serif;
    --sans:"Schibsted Grotesk", system-ui, sans-serif;
    --gutter:clamp(1rem,4vw,2.5rem);
    --max:72rem;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:1rem;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:4px}
  [x-cloak]{display:none!important}
  .ext{width:.72em;height:.72em;margin-left:.25em;vertical-align:.05em;opacity:.6;flex:none}
  .inner{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}

  /* ---------- top bar ---------- */
  .top .inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem;padding-bottom:.9rem}
  .brand{display:flex;align-items:center;gap:.7rem;min-width:0}
  .brand img{width:26px;height:auto;display:block}
  .brand span{font-family:var(--serif);font-size:1.3rem;font-weight:450;letter-spacing:-.005em;white-space:nowrap}
  .me{position:relative}
  .me-btn{
    display:flex;align-items:center;gap:.8rem;background:none;border:0;padding:.25rem .25rem .25rem .6rem;
    border-radius:var(--r-m);cursor:pointer;text-align:right;
  }
  .me-btn:hover{background:var(--bg-2)}
  .me-btn .who{line-height:1.25}
  .me-btn .who b{display:block;font-weight:600;font-size:.95rem}
  .me-btn .who small{display:block;font-size:.8rem;color:var(--faint)}
  .portrait{
    width:40px;height:50px;border-radius:5px;overflow:hidden;flex:none;background:#d6d2cc;
    box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07);
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  .menu{
    position:absolute;right:0;top:calc(100% + .5rem);z-index:40;min-width:14.5rem;
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);
    padding:.4rem;box-shadow:0 18px 50px rgba(0,0,0,.5);list-style:none;margin:0;
  }
  .menu a{display:flex;align-items:center;padding:.55rem .75rem;border-radius:var(--r-s);font-size:.95rem}
  .menu a:hover,.menu a:focus-visible{background:var(--bg-3);outline-offset:-2px}
  .menu .sep{height:1px;background:var(--line);margin:.35rem .4rem}
  .menu .quiet{color:var(--dim)}

  /* ---------- section tabs ---------- */
  .nav{border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:.25rem;list-style:none;margin:0;padding:0}
  .tab{
    position:relative;display:block;background:none;border:0;cursor:pointer;
    padding:.7rem .85rem .85rem;font-size:.98rem;font-weight:500;color:var(--dim);white-space:nowrap;
    border-radius:var(--r-s) var(--r-s) 0 0;transition:color .15s;
  }
  .tabs li:first-child .tab{padding-left:0}
  .tab:hover{color:var(--ink)}
  .tab::after{
    content:"";position:absolute;left:.85rem;right:.85rem;bottom:-1px;height:2px;border-radius:2px;
    background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease);
  }
  .tabs li:first-child .tab::after{left:0}
  .tab.on{color:var(--ink)}
  .tab.on::after{transform:scaleX(1)}
  .tab:focus-visible{outline-offset:-2px}

  /* ---------- sub-nav strip (desktop) ---------- */
  .sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease);border-bottom:1px solid transparent}
  .sub.open{grid-template-rows:1fr;border-bottom-color:var(--line-soft);background:linear-gradient(var(--bg-2),var(--bg-2)) no-repeat;background-size:100% 100%}
  .sub-clip{overflow:hidden;min-height:0}
  .sub-body{display:flex;align-items:center;gap:.25rem 1.6rem;flex-wrap:wrap;padding-top:.8rem;padding-bottom:.8rem}
  .sub-body.swap{animation:swap .24s var(--ease)}
  @keyframes swap{from{opacity:0;transform:translateY(-3px)}}
  .sub-head{display:none}
  .sub-links{display:flex;flex-wrap:wrap;gap:.25rem 1.6rem;list-style:none;margin:0;padding:0}
  .sub-links a{display:inline-flex;align-items:center;font-size:.95rem;color:var(--dim);padding:.2rem 0;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
  .sub-links a:hover{color:var(--ink);border-bottom-color:var(--faint)}
  .sub-admin{margin-left:auto;font-size:.85rem;color:var(--faint);padding:.2rem 0 .2rem 1rem;border-left:1px solid var(--line)}
  .sub-admin:hover{color:var(--dim)}
  .backdrop{display:none}

  /* ---------- page body ---------- */
  .page{padding-top:clamp(3rem,10vh,6.5rem);padding-bottom:8rem}
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(2.5rem,6vw,6rem);align-items:start}
  .hello h1{
    margin:0;font-family:var(--serif);font-weight:350;font-optical-sizing:auto;
    font-size:clamp(2.6rem,6.4vw,4.9rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance;
  }
  .hello .line{margin:1.5rem 0 0;color:var(--dim);font-size:1rem}
  .hello .line b{color:var(--ember-hot);font-weight:600}
  .hello .line .dot{color:var(--faint);margin:0 .45em}
  .hello .line a{color:var(--ink);border-bottom:1px solid var(--faint);transition:border-color .15s}
  .hello .line a:hover{border-color:var(--ember)}

  .soon{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:1.5rem 1.5rem 1.1rem}
  .soon h2{margin:0 0 1.1rem;font-size:.9rem;font-weight:500;color:var(--faint)}
  .next{display:block;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
  .next .kind{display:block;font-size:.85rem;color:var(--ember-hot);margin-bottom:.35rem}
  .next .date{display:block;font-family:var(--serif);font-size:clamp(1.7rem,3vw,2.1rem);font-weight:450;line-height:1.1;letter-spacing:-.01em}
  .next .date .tm{color:var(--dim);font-weight:350}
  .next .title{display:block;margin-top:.4rem;font-weight:600;font-size:1.05rem}
  .next:hover .title{text-decoration:underline;text-decoration-color:var(--ember);text-underline-offset:4px}
  .later{list-style:none;margin:0;padding:.4rem 0 0}
  .later a{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:.75rem;align-items:baseline;padding:.6rem .5rem;margin:0 -.5rem;border-radius:var(--r-s);font-size:.93rem}
  .later a:hover{background:var(--bg-3)}
  .later .d{color:var(--faint)}
  .later .w{color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .later .w small{display:block;color:var(--faint);font-size:.85rem}
  .later .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .cal{display:inline-block;margin-top:.7rem;font-size:.88rem;color:var(--dim);border-bottom:1px solid var(--faint)}
  .cal:hover{color:var(--ink);border-color:var(--ember)}

  /* ---------- demo ---------- */
  .demo{position:fixed;left:var(--gutter);bottom:1rem;z-index:30;font-size:.85rem}
  .demo>button{background:var(--bg);color:var(--faint);border:1px dashed var(--faint);border-radius:999px;padding:.35rem .8rem;cursor:pointer}
  .demo>button:hover{color:var(--ink)}
  .demo-panel{position:absolute;bottom:calc(100% + .5rem);left:0;width:14rem;background:var(--bg-2);border:1px dashed var(--faint);border-radius:var(--r-m);padding:.9rem 1rem;display:grid;gap:.8rem;color:var(--dim)}
  .demo-panel fieldset{border:0;margin:0;padding:0;display:grid;gap:.3rem}
  .demo-panel legend{color:var(--ink);font-weight:600;margin-bottom:.25rem}
  .demo-panel label{display:flex;gap:.5rem;align-items:center;cursor:pointer}
  .demo-panel input{accent-color:var(--ember)}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .me-btn .who small{display:none}
  }
  @media (max-width:640px){
    .top .inner{padding-top:.75rem;padding-bottom:.75rem}
    .brand span{font-size:1.15rem}
    .me-btn{padding-left:.4rem;gap:.6rem}
    .me-btn .who b{font-size:.88rem}
    .nav{border-bottom:0}
    .nav .inner{padding:0}
    /* segmented, horizontally scrollable */
    .tabs{
      overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
      margin:0 var(--gutter) .25rem;padding:.25rem;gap:.2rem;
      background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);
    }
    .tabs::-webkit-scrollbar{display:none}
    .tabs li{scroll-snap-align:start;flex:none}
    .tab,.tabs li:first-child .tab{padding:.5rem .9rem;border-radius:var(--r-s);font-size:.93rem}
    .tab::after,.tabs li:first-child .tab::after{left:.9rem;right:.9rem;bottom:.2rem;height:2px}
    .tab.on{background:var(--bg-3)}
    /* sub-nav becomes a bottom sheet */
    .sub,.sub.open{
      position:fixed;left:0;right:0;bottom:0;z-index:50;display:block;
      background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;
      box-shadow:0 -20px 60px rgba(0,0,0,.5);
      transform:translateY(105%);visibility:hidden;
      transition:transform .28s var(--ease),visibility 0s linear .28s;
      max-height:80vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom);
    }
    .sub.open{transform:none;visibility:visible;transition:transform .28s var(--ease),visibility 0s}
    .sub-clip{overflow:visible}
    .sub-body{display:block;padding:1rem var(--gutter) 1.25rem}
    .sub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
    .sub-head h2{margin:0;font-family:var(--serif);font-weight:450;font-size:1.45rem}
    .sub-head button{background:none;border:0;color:var(--dim);padding:.5rem .25rem;cursor:pointer}
    .sub-links{display:block}
    .sub-links li+li a{border-top:1px solid var(--line-soft)}
    .sub-links a{display:flex;padding:.85rem 0;font-size:1.05rem;color:var(--ink);border-bottom:0}
    .sub-links a:hover{border-bottom:0}
    .sub-admin{display:block;margin:.5rem 0 0;border-left:0;border-top:1px solid var(--line);padding:.9rem 0 .2rem;font-size:.93rem}
    .backdrop{display:block;position:fixed;inset:0;z-index:45;background:rgba(12,12,13,.55);opacity:0;pointer-events:none;transition:opacity .25s}
    .backdrop.open{opacity:1;pointer-events:auto}
    .page{padding-top:2.5rem}
    .soon{padding:1.25rem 1.1rem 1rem}
    .later a{grid-template-columns:4.6rem minmax(0,1fr) auto}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body x-data="app()" x-init="init()" @keydown.escape.window="onEsc()">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M8 16 16 8M9.5 8H16v6.5"/></symbol>
</svg>

<header class="top">
  <div class="inner">
    <a class="brand" href="/app" @click.prevent="closeSection()">
      <img src="../../logo.png" alt="">
      <span>Armé Riddere</span>
    </a>

    <div class="me" @click.outside="meOpen=false">
      <button class="me-btn" x-ref="meBtn" type="button" aria-haspopup="true" :aria-expanded="meOpen" aria-controls="me-menu"
              @click="toggleMe()" @keydown.down.prevent="openMe()">
        <span class="who">
          <b>Ola Nordmann</b>
          <small x-text="status==='aktiv' ? '2. tenor, Ridder' : 'Ridder, ypp.com.'"></small>
        </span>
        <span class="portrait"><img src="../../portrett.png" alt=""></span>
      </button>
      <ul class="menu" id="me-menu" x-ref="meMenu" x-show="meOpen" x-cloak
          @keydown.down.prevent="moveMenu(1)" @keydown.up.prevent="moveMenu(-1)" @keydown.tab="meOpen=false">
        <li><a href="/app/oving">Registrer øving</a></li>
        <li><a href="/app/mitt-repertoar">Mitt repertoar</a></li>
        <li><a href="/app/achievements">Achievements</a></li>
        <li><a href="/app/profil">Profilinnstillinger</a></li>
        <li><a href="/margames" target="_blank" rel="noopener">MAR Games<svg class="ext" aria-label="åpnes i ny fane"><use href="#i-out"/></svg></a></li>
        <li class="sep" role="presentation"></li>
        <li><a class="quiet" href="/logout">Logg ut</a></li>
      </ul>
    </div>
  </div>
</header>

<div @click.outside="if(!isMobile()) closeSection()">
  <nav class="nav" aria-label="Seksjoner">
    <div class="inner">
      <ul class="tabs" x-ref="tabs" @keydown.right.prevent="moveTab(1)" @keydown.left.prevent="moveTab(-1)">
        <li>
          <a class="tab" :class="!section && 'on'" href="/app" aria-current="page" @click.prevent="closeSection()">Hjem</a>
        </li>
        <template x-for="k in order" :key="k">
          <li>
            <button class="tab" type="button" :class="section===k && 'on'" :id="'tab-'+k"
                    :aria-expanded="section===k" aria-controls="subnav"
                    @click="toggleSection(k)" x-text="groups[k].label"></button>
          </li>
        </template>
      </ul>
    </div>
  </nav>

  <div class="backdrop" :class="section && 'open'" @click="closeSection()" aria-hidden="true"></div>

  <div class="sub" id="subnav" :class="section && 'open'" :aria-hidden="!section" :inert="!section"
       role="region" :aria-labelledby="section ? 'tab-'+section : null">
    <div class="sub-clip">
      <template x-for="k in (section ? [section] : [shown])" :key="k + '-' + tick">
        <div class="inner sub-body" :class="animate && 'swap'" x-show="k">
          <div class="sub-head">
            <h2 x-text="k && groups[k].label"></h2>
            <button type="button" @click="closeSection()">Lukk</button>
          </div>
          <ul class="sub-links">
            <template x-for="p in pages(k)" :key="p.t">
              <li><a :href="p.h" :target="p.ext ? '_blank' : null" :rel="p.ext ? 'noopener' : null"><span x-text="p.t"></span><svg class="ext" x-show="p.ext" aria-label="åpnes i ny fane"><use href="#i-out"/></svg></a></li>
            </template>
          </ul>
          <template x-if="admin(k)">
            <a class="sub-admin" :href="admin(k).h" x-text="admin(k).t"></a>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<main class="page">
  <div class="inner grid">
    <section class="hello" aria-labelledby="hi">
      <h1 id="hi"><span x-text="greeting"></span>, Ola.</h1>
      <p class="line" x-show="status==='aktiv'">
        <b>6 dager</b> på rad<span class="dot" aria-hidden="true">·</span><a href="/app/oving">Registrer øving</a>
      </p>
      <p class="line" x-show="status==='tidligere'" x-cloak>
        Koret synger snart igjen. Du er alltid velkommen i salen.
      </p>
    </section>

    <section class="soon" aria-labelledby="soon-h">
      <h2 id="soon-h" x-text="isToday(lead.iso) ? 'I dag' : 'Snart'"></h2>
      <a class="next" :href="lead.href">
        <span class="kind" x-text="lead.kind"></span>
        <span class="date"><span x-text="lead.day"></span> <span class="tm" x-text="lead.time"></span></span>
        <span class="title" x-text="lead.title"></span>
      </a>
      <ul class="later">
        <template x-for="e in later" :key="e.id">
          <li><a :href="'/app/kalender#'+e.id">
            <span class="d" x-text="e.d"></span>
            <span class="w"><span x-text="e.w"></span><small x-show="e.where" x-text="e.where"></small></span>
            <span class="t" x-text="e.t"></span>
          </a></li>
        </template>
      </ul>
      <a class="cal" href="/app/kalender">Åpne kalenderen</a>
    </section>
  </div>
</main>

<div class="demo" @click.outside="demoOpen=false">
  <button type="button" :aria-expanded="demoOpen" aria-controls="demo-panel" @click="demoOpen=!demoOpen">Demo</button>
  <div class="demo-panel" id="demo-panel" x-show="demoOpen" x-cloak>
    <fieldset>
      <legend>Status</legend>
      <label><input type="radio" value="aktiv" x-model="status"> Aktiv</label>
      <label><input type="radio" value="tidligere" x-model="status"> Tidligere</label>
    </fieldset>
    <fieldset>
      <legend>Roller</legend>
      <label><input type="checkbox" value="master" x-model="roles"> master</label>
      <label><input type="checkbox" value="notes" x-model="roles"> notes</label>
    </fieldset>
  </div>
</div>

<script>
function app(){
  return {
    status:'aktiv', roles:[], section:null, shown:null, tick:0, animate:false,
    meOpen:false, demoOpen:false, greeting:'Hei',
    order:['noter','medlemmer','ridderdata','kontakt'],
    groups:{
      noter:{label:'Noter', pages:[
        {t:'Sanger', h:'/app/sanger'},
        {t:'Repertoar', h:'/app/repertoar', activeOnly:true},
        {t:'Øvingsplan', h:'/app/ovingsplan', activeOnly:true},
        {t:'Toneangiver', h:'/toneangiver', ext:true},
      ], admin:{t:'Note-admin', h:'/app/admin/noter', roles:['notes','master']}},
      medlemmer:{label:'Medlemmer', pages:[
        {t:'Medlemmer', h:'/app/medlemmer'},
        {t:'Styret', h:'/app/styret'},
      ], admin:{t:'Admin', h:'/app/admin', roles:['master']}},
      ridderdata:{label:'Ridderdata', pages:[
        {t:'Kalender', h:'/app/kalender'},
        {t:'Dokumenter', h:'/app/dokumenter'},
        {t:'RidderWiki', h:'/ridderwiki', ext:true},
        {t:'Videoarkiv', h:'/ridderwiki/Videoarkiv', ext:true},
        {t:'Bildearkiv', h:'https://armeriddere.smugmug.com', ext:true},
      ]},
      kontakt:{label:'Kontakt', pages:[
        {t:'Epostlister', h:'/app/epost'},
        {t:'Anonym Forum', h:'/app/forum'},
      ]},
    },
    events:{
      aktiv:{
        lead:{iso:'2025-10-02', kind:'Neste øving', day:'Torsdag 2. okt', time:'19:00', title:'«Julekonsert-innspurt»', href:'/app/ovingsplan'},
        later:[
          {id:'2025-10-04', d:'Lør 4. okt', w:'Opptreden', where:'Grieghallen foyer', t:'14:00'},
          {id:'2025-10-09', d:'Tor 9. okt', w:'Øving', t:'19:00'},
          {id:'2025-10-17', d:'Fre 17. okt', w:'Semesterfest', t:''},
        ]},
      tidligere:{
        lead:{iso:'2025-10-04', kind:'Neste opptreden', day:'Lørdag 4. okt', time:'14:00', title:'Grieghallen foyer', href:'/app/kalender#2025-10-04'},
        later:[
          {id:'2025-11-08', d:'Lør 8. nov', w:'Høstkonsert', where:'Universitetsaulaen', t:'18:00'},
          {id:'2025-12-13', d:'Lør 13. des', w:'Julekonsert', where:'Johanneskirken', t:'19:00'},
        ]},
    },
    get lead(){ return this.events[this.status].lead },
    get later(){ return this.events[this.status].later },
    init(){
      const h = new Date().getHours();
      this.greeting = h<5 ? 'God natt' : h<10 ? 'God morgen' : h<12 ? 'God formiddag' : h<18 ? 'God ettermiddag' : 'God kveld';
    },
    isToday(iso){ return new Date().toISOString().slice(0,10) === iso },
    isMobile(){ return matchMedia('(max-width:640px)').matches },
    pages(k){
      if(!k) return [];
      return this.groups[k].pages.filter(p => !(p.activeOnly && this.status==='tidligere'));
    },
    admin(k){
      const a = k && this.groups[k].admin;
      return a && a.roles.some(r => this.roles.includes(r)) ? a : null;
    },
    toggleSection(k){
      if(this.section===k){ this.closeSection(true); return; }
      const swapping = !!this.section;
      this.section = k; this.shown = k;
      this.animate = swapping; this.tick++;
      this.meOpen = false;
      if(this.isMobile()){
        this.$nextTick(() => { const a = document.querySelector('#subnav a'); a && a.focus({preventScroll:true}); });
      }
    },
    closeSection(refocus){
      if(!this.section) return;
      const k = this.section;
      this.section = null; this.animate = false;
      if(refocus || this.isMobile()) this.$nextTick(() => document.getElementById('tab-'+k)?.focus());
    },
    onEsc(){
      if(this.meOpen){ this.meOpen=false; this.$refs.meBtn.focus(); return; }
      if(this.demoOpen){ this.demoOpen=false; return; }
      if(this.section) this.closeSection(true);
    },
    moveTab(d){
      const tabs = [...this.$refs.tabs.querySelectorAll('.tab')];
      const i = tabs.indexOf(document.activeElement);
      const n = tabs[(i + d + tabs.length) % tabs.length];
      n.focus(); n.scrollIntoView({block:'nearest', inline:'nearest'});
    },
    toggleMe(){ this.meOpen ? (this.meOpen=false) : this.openMe() },
    openMe(){
      this.meOpen = true; this.section && this.isMobile() && (this.section=null);
      this.$nextTick(() => this.$refs.meMenu.querySelector('a').focus());
    },
    moveMenu(d){
      const items = [...this.$refs.meMenu.querySelectorAll('a')];
      const i = items.indexOf(document.activeElement);
      items[(i + d + items.length) % items.length].focus();
    },
  }
}
</script>
</body>
</html>
