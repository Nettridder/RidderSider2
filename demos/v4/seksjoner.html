<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seksjoner – Armé Riddere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<style>
  :root{
    --bg:#1d1e20;          /* graphite */
    --bg-2:#25272a;        /* raised iron */
    --bg-3:#2d3034;
    --line:#35383d;
    --line-soft:#2b2d31;
    --ink:#efe8dc;         /* bone */
    --dim:#b3ab9f;
    --faint:#7d776e;
    --ember:#ec6c00;
    --ember-hot:#ff8a2b;
    --ember-soft:rgba(236,108,0,.13);
    --r-s:6px;
    --r-m:10px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --serif:"Newsreader", Georgia, serif;
    --sans:"Schibsted Grotesk", system-ui, sans-serif;
    --gutter:clamp(1rem,4vw,2.5rem);
    --max:72rem;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:1rem;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:4px}
  [x-cloak]{display:none!important}
  .ext{width:.72em;height:.72em;margin-left:.25em;vertical-align:.05em;opacity:.6;flex:none}
  .inner{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- top bar ---------- */
  .top .inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem;padding-bottom:.9rem}
  .brand{display:flex;align-items:center;gap:.7rem;min-width:0}
  .brand img{width:26px;height:auto;display:block}
  .brand span{font-family:var(--serif);font-size:1.3rem;font-weight:450;letter-spacing:-.005em;white-space:nowrap}
  .me{position:relative}
  .me-btn{
    display:flex;align-items:center;gap:.8rem;background:none;border:0;padding:.25rem .25rem .25rem .6rem;
    border-radius:var(--r-m);cursor:pointer;text-align:right;
  }
  .me-btn:hover{background:var(--bg-2)}
  .me-btn .who{line-height:1.25}
  .me-btn .who b{display:block;font-weight:600;font-size:.95rem}
  .me-btn .who small{display:block;font-size:.8rem;color:var(--faint)}
  .portrait{
    width:40px;height:50px;border-radius:5px;overflow:hidden;flex:none;background:#d6d2cc;
    box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07);
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  .menu{
    position:absolute;right:0;top:calc(100% + .5rem);z-index:40;min-width:14.5rem;
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);
    padding:.4rem;box-shadow:0 18px 50px rgba(0,0,0,.5);list-style:none;margin:0;
  }
  .menu a{display:flex;align-items:center;padding:.55rem .75rem;border-radius:var(--r-s);font-size:.95rem}
  .menu a:hover,.menu a:focus-visible{background:var(--bg-3);outline-offset:-2px}
  .menu .sep{height:1px;background:var(--line);margin:.35rem .4rem}
  .menu .quiet{color:var(--dim)}

  /* ---------- main menu bar (own component; can later be docked at the bottom on mobile) ---------- */
  .mainbar{border-bottom:1px solid var(--line)}
  .mainbar-list{display:flex;gap:.25rem;list-style:none;margin:0;padding:0}
  .mainbar-btn{
    position:relative;display:block;padding:.7rem .85rem .85rem;font-size:.98rem;font-weight:500;color:var(--dim);
    white-space:nowrap;border-radius:var(--r-s) var(--r-s) 0 0;transition:color .15s;
  }
  .mainbar-list li:first-child .mainbar-btn{padding-left:0}
  .mainbar-btn:hover{color:var(--ink)}
  .mainbar-btn::after{
    content:"";position:absolute;left:.85rem;right:.85rem;bottom:-1px;height:2px;border-radius:2px;
    background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease);
  }
  .mainbar-list li:first-child .mainbar-btn::after{left:0}
  .mainbar-btn.on{color:var(--ink)}
  .mainbar-btn.on::after{transform:scaleX(1)}
  .mainbar-btn:focus-visible{outline-offset:-2px}

  /* ---------- page body ---------- */
  .page{padding-top:clamp(2.5rem,8vh,5rem);padding-bottom:8rem}
  .page-h:focus{outline:none}

  /* Hjem */
  .home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(2.5rem,6vw,6rem);align-items:start}
  .hello h1{
    margin:0;font-family:var(--serif);font-weight:350;font-optical-sizing:auto;
    font-size:clamp(1.9rem,3.6vw,2.7rem);line-height:1.08;letter-spacing:-.015em;color:var(--dim);
  }
  .hello .line{margin:.6rem 0 0;color:var(--dim);font-size:.98rem}
  .hello .line b{color:var(--ember-hot);font-weight:600;font-variant-numeric:tabular-nums;display:inline-block}
  .hello .line b.bump{animation:bump .6s var(--ease)}
  @keyframes bump{30%{transform:translateY(-3px);color:var(--ink)}}
  .hello .line .dot{color:var(--faint);margin:0 .45em}

  .log{margin-top:clamp(2.5rem,6vh,3.75rem)}
  .log-q{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:.1em .35em;margin:0;
    font-family:var(--serif);font-weight:350;font-size:clamp(2.4rem,5.6vw,4.2rem);line-height:1.1;letter-spacing:-.02em;
  }
  .log-min{
    width:2.3em;padding:0 .05em;background:none;border:0;border-bottom:2px solid var(--faint);
    font-family:var(--serif);font-weight:450;font-size:1em;letter-spacing:-.02em;text-align:center;color:var(--ink);
    -moz-appearance:textfield;border-radius:0;transition:border-color .15s;
  }
  .log-min::-webkit-outer-spin-button,.log-min::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .log-min:hover{border-bottom-color:var(--dim)}
  .log-min:focus{outline:none;border-bottom-color:var(--ember)}
  .log-day{
    background:none;field-sizing:content;border:0;border-bottom:2px dotted var(--faint);border-radius:0;padding:0 .1em;cursor:pointer;
    font-family:var(--serif);font-weight:350;font-size:1em;letter-spacing:-.02em;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  .log-day:hover{border-bottom-color:var(--dim)}
  .log-day:focus{outline:none;border-bottom-color:var(--ember)}
  .log-day option{font-family:var(--sans);font-size:1rem;background:var(--bg-2)}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem;list-style:none;padding:0}
  .chip{
    background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:.35rem .85rem;
    font-size:.9rem;color:var(--dim);cursor:pointer;font-variant-numeric:tabular-nums;transition:color .15s,border-color .15s;
  }
  .chip:hover{color:var(--ink);border-color:var(--faint)}
  .log-go{display:flex;align-items:center;flex-wrap:wrap;gap:1rem 1.25rem;margin-top:2rem}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;background:var(--ember);color:#1a1004;border:0;border-radius:var(--r-s);
    padding:.8rem 1.3rem;font-weight:600;font-size:1rem;cursor:pointer;transition:background .15s;
  }
  .btn:hover{background:var(--ember-hot)}
  .btn:disabled{background:var(--bg-3);color:var(--faint);cursor:not-allowed}
  .btn.done{background:var(--bg-3);color:var(--ink)}
  .btn svg{width:1.05em;height:1.05em}
  .btn-quiet{background:var(--bg-2);color:var(--ink);border:1px solid var(--line)}
  .btn-quiet:hover{background:var(--bg-3)}
  .log-note{margin:0;color:var(--dim);font-size:.93rem}
  .log-note.ok{color:var(--ink)}
  .log-note.ok::before{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--ember);margin-right:.55rem;vertical-align:.12em}
  .fade-in{animation:fadein .3s var(--ease)}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}}
  .tid{margin:1.5rem 0 0;color:var(--dim);max-width:30rem}

  .soon{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:1.5rem 1.5rem 1.1rem}
  .soon h2{margin:0 0 1.1rem;font-size:.9rem;font-weight:500;color:var(--faint)}
  .next{display:block;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
  .next .kind{display:block;font-size:.85rem;color:var(--ember-hot);margin-bottom:.35rem}
  .next .date{display:block;font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,1.85rem);font-weight:450;line-height:1.1;letter-spacing:-.01em}
  .next .date .tm{color:var(--dim);font-weight:350}
  .next .title{display:block;margin-top:.4rem;font-weight:600;font-size:1.05rem}
  .next:hover .title{text-decoration:underline;text-decoration-color:var(--ember);text-underline-offset:4px}
  .later{list-style:none;margin:0;padding:.4rem 0 0}
  .later a{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:.75rem;align-items:baseline;padding:.6rem .5rem;margin:0 -.5rem;border-radius:var(--r-s);font-size:.93rem}
  .later a:hover{background:var(--bg-3)}
  .later .d{color:var(--faint)}
  .later .w{color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .later .w small{display:block;color:var(--faint);font-size:.85rem}
  .later .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .cal{display:inline-block;margin-top:.7rem;font-size:.88rem;color:var(--dim);border-bottom:1px solid var(--faint)}
  .cal:hover{color:var(--ink);border-color:var(--ember)}

  /* Section pages: quiet side list + content */
  .sect{display:grid;grid-template-columns:12.5rem minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:start}
  .side{position:sticky;top:1.5rem}
  .side h2{margin:0 0 .9rem;font-family:var(--serif);font-weight:450;font-size:1.25rem;color:var(--dim)}
  .side ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .side a{
    position:relative;display:flex;align-items:center;padding:.4rem 0 .4rem 1rem;font-size:.95rem;color:var(--dim);transition:color .15s;
  }
  .side a:hover{color:var(--ink)}
  .side a.on{color:var(--ink);font-weight:500}
  .side a.on::before{content:"";position:absolute;left:-1px;top:.35rem;bottom:.35rem;width:2px;background:var(--ember);border-radius:2px}
  .side a:focus-visible{outline-offset:-2px}
  .side .adm{margin-top:1rem;padding-top:.6rem;border-top:1px dashed var(--line);border-left:0}
  .side .adm a{font-size:.87rem;color:var(--faint);padding-left:1rem}
  .side .adm a:hover,.side .adm a.on{color:var(--dim)}

  .body-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}
  .body-h h1{margin:0;font-family:var(--serif);font-weight:350;font-size:clamp(2rem,4vw,2.9rem);line-height:1.05;letter-spacing:-.02em}
  .body-h p{margin:.45rem 0 0;color:var(--faint);font-size:.93rem}
  .search{
    width:100%;max-width:20rem;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);
    padding:.6rem .85rem;font-size:.95rem;color:var(--ink);
  }
  .search::placeholder{color:var(--faint)}
  .search:focus{outline:none;border-color:var(--ember)}
  .empty{color:var(--faint);padding:1.5rem 0}

  .rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
  .rows>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem 1.25rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line-soft)}
  .rows .nm{font-weight:500;min-width:0}
  .rows .nm small{display:block;font-weight:400;color:var(--faint);font-size:.86rem}
  .rows .aside{color:var(--dim);font-size:.9rem;font-variant-numeric:tabular-nums;text-align:right}

  /* knowledge marker */
  .know{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-s);padding:2px}
  .know button{
    display:inline-flex;align-items:center;gap:.4rem;background:none;border:0;border-radius:4px;cursor:pointer;
    padding:.28rem .6rem;font-size:.82rem;color:var(--faint);white-space:nowrap;transition:color .15s,background .15s;
  }
  .know button:hover{color:var(--ink)}
  .know button[aria-pressed="true"]{background:var(--bg-3);color:var(--ink)}
  .know .pip{width:.5rem;height:.5rem;border-radius:50%;border:1.5px solid currentColor;flex:none}
  .know .k-kjent[aria-pressed="true"] .pip{background:var(--ember);border-color:var(--ember)}
  .know .k-litt[aria-pressed="true"] .pip{border-color:var(--ember);background:linear-gradient(90deg,var(--ember) 50%,transparent 50%)}
  .know .k-ikke[aria-pressed="true"] .pip{border-color:var(--dim)}
  .know button:focus-visible{outline-offset:0}

  /* Repertoar */
  .order{list-style:none;margin:0;padding:0;counter-reset:n;border-top:1px solid var(--line-soft)}
  .order li{counter-increment:n;display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:1rem;align-items:baseline;padding:.8rem 0;border-bottom:1px solid var(--line-soft)}
  .order li::before{content:counter(n);color:var(--faint);font-variant-numeric:tabular-nums;font-size:.9rem}
  .order small{color:var(--faint);font-size:.86rem}

  /* Øvingsplan / Kalender */
  .plan{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
  .plan li{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:1.1rem 1.25rem}
  .plan .when{font-family:var(--serif);font-size:1.35rem;font-weight:450}
  .plan .when span{color:var(--dim);font-weight:350}
  .plan .what{margin-top:.2rem;font-weight:600}
  .plan .songs{margin-top:.35rem;color:var(--dim);font-size:.92rem}
  .plan li:first-child{border-color:var(--line)}
  .month{margin:2rem 0 .5rem;font-family:var(--serif);font-weight:450;font-size:1.2rem;color:var(--dim)}
  .month:first-of-type{margin-top:0}
  .cal-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:1rem;align-items:baseline}
  .cal-row .d{color:var(--faint);font-size:.92rem}
  .cal-row .t{color:var(--dim);font-size:.9rem;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;margin-left:.5rem;font-size:.78rem;color:var(--ember-hot);background:var(--ember-soft);border-radius:999px;padding:.05rem .5rem;vertical-align:.1em}

  /* Toneangiver */
  .tone{display:flex;align-items:center;gap:1rem;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
  .tone .play{
    width:2.25rem;height:2.25rem;border-radius:50%;flex:none;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--bg-2);color:var(--dim);transition:color .15s,border-color .15s,background .15s;
  }
  .tone .play svg{width:.85rem;height:.85rem}
  .tone:hover .play{color:var(--ink);border-color:var(--faint)}
  .tone.playing .play{background:var(--ember);border-color:var(--ember);color:#1a1004}
  .tone .nm{flex:1}
  .tone .key{font-family:var(--serif);font-size:1.35rem;font-weight:450;min-width:2.5rem;text-align:right}
  .tone.playing .key{color:var(--ember-hot)}
  .tone:focus-visible{outline-offset:4px}
  .bars{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem;margin-left:.5rem;vertical-align:-.05em}
  .bars i{width:2px;background:var(--ember-hot);border-radius:1px;animation:bar .7s ease-in-out infinite alternate}
  .bars i:nth-child(2){animation-delay:-.25s}.bars i:nth-child(3){animation-delay:-.5s}
  @keyframes bar{from{height:25%}to{height:100%}}

  /* Medlemmer */
  .seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-s);padding:2px}
  .seg button{background:none;border:0;border-radius:4px;padding:.35rem .8rem;font-size:.88rem;color:var(--dim);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--bg-3);color:var(--ink)}
  .mlist .who{display:flex;align-items:center;gap:.9rem}
  .mlist .portrait{width:32px;height:40px;box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07)}
  .gallery{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:1.75rem 1.25rem}
  .gallery .portrait{width:100%;height:auto;aspect-ratio:4/5;border-radius:6px}
  .gallery b{display:block;margin-top:.7rem;font-weight:500;font-size:.95rem}
  .gallery small{color:var(--faint);font-size:.85rem}

  /* Epost / forum / placeholders */
  .toggle{display:inline-flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem;color:var(--dim)}
  .toggle input{position:absolute;opacity:0;width:1px;height:1px}
  .toggle .sw{width:2.1rem;height:1.2rem;border-radius:999px;background:var(--bg-3);border:1px solid var(--line);position:relative;transition:background .15s;flex:none}
  .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:.8rem;height:.8rem;border-radius:50%;background:var(--dim);transition:transform .18s var(--ease),background .15s}
  .toggle input:checked+.sw{background:var(--ember-soft);border-color:var(--ember)}
  .toggle input:checked+.sw::after{transform:translateX(.9rem);background:var(--ember-hot)}
  .toggle input:focus-visible+.sw{outline:2px solid var(--ember);outline-offset:2px}
  .form{display:grid;gap:1.1rem;max-width:36rem}
  .form label.f{display:grid;gap:.4rem;font-size:.9rem;color:var(--dim)}
  .form input[type=text],.form textarea{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:.7rem .85rem;color:var(--ink);font-size:1rem;
  }
  .form textarea{min-height:9rem;resize:vertical;line-height:1.5}
  .form input:focus,.form textarea:focus{outline:none;border-color:var(--ember)}
  .form .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .hint{margin:0;color:var(--faint);font-size:.88rem}
  .ph{max-width:34rem;color:var(--dim)}
  .ph p{margin:0 0 1rem}
  .doclist a:hover .nm{text-decoration:underline;text-decoration-color:var(--ember);text-underline-offset:4px}
  .doclist a{display:contents}

  /* ---------- demo ---------- */
  .demo{position:fixed;left:var(--gutter);bottom:1rem;z-index:30;font-size:.85rem}
  .demo>button{background:var(--bg);color:var(--faint);border:1px dashed var(--faint);border-radius:999px;padding:.35rem .8rem;cursor:pointer}
  .demo>button:hover{color:var(--ink)}
  .demo-panel{position:absolute;bottom:calc(100% + .5rem);left:0;width:14rem;background:var(--bg-2);border:1px dashed var(--faint);border-radius:var(--r-m);padding:.9rem 1rem;display:grid;gap:.8rem;color:var(--dim)}
  .demo-panel fieldset{border:0;margin:0;padding:0;display:grid;gap:.3rem}
  .demo-panel legend{color:var(--ink);font-weight:600;margin-bottom:.25rem}
  .demo-panel label{display:flex;gap:.5rem;align-items:center;cursor:pointer}
  .demo-panel input{accent-color:var(--ember)}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    .home{grid-template-columns:minmax(0,1fr)}
    .me-btn .who small{display:none}
    .sect{grid-template-columns:minmax(0,1fr);gap:1.5rem}
    .side{position:static}
    .side h2{display:none}
    .side nav{overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
    .side nav::-webkit-scrollbar{display:none}
    .side ul,.side .adm{display:flex;gap:.4rem;border:0;margin:0;padding:0}
    .side nav>div{display:flex;gap:.4rem;width:max-content}
    .side .adm{margin-left:.4rem;padding-left:.8rem;border-left:1px dashed var(--line)}
    .side a,.side .adm a{
      padding:.35rem .8rem;border:1px solid var(--line-soft);border-radius:999px;font-size:.88rem;white-space:nowrap;background:none;
    }
    .side a.on{background:var(--bg-2);border-color:var(--line);font-weight:500}
    .side a.on::before{display:none}
    .side a.on{box-shadow:inset 0 -2px 0 var(--ember)}
  }
  @media (max-width:640px){
    .top .inner{padding-top:.75rem;padding-bottom:.75rem}
    .brand span{font-size:1.15rem}
    .me-btn{padding-left:.4rem;gap:.6rem}
    .me-btn .who b{font-size:.88rem}
    .mainbar{border-bottom:0}
    .mainbar .inner{padding:0}
    .mainbar-list{
      overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;

<nav class="mainbar" aria-label="Hovedmeny">

      <template x-for="k in order" :key="k">
        <li>
          <a class="mainbar-btn" :class="sec===k && 'on'" :href="k==='hjem' ? '#/' : '#/'+k"

        </li>
      </template>
    </ul>
  </div>
</nav>

<main class="page">
  <div class="inner">

    <!-- ============ Hjem ============ -->

          </p>
        </div>

        <form class="log" x-show="status==='aktiv'" @submit.prevent="register()" aria-label="Registrer øving">
          <p class="log-q">
            <label for="min">Jeg øvde</label>
            <input id="min" class="log-min" x-ref="min" type="number" inputmode="numeric" min="1" max="600" x-model.number="minutes" @focus="$event.target.select()">
            <span>min</span>
            <label class="sr" for="day">Dag</label>
            <select id="day" class="log-day" x-model="day">
              <template x-for="d in days" :key="d.v"><option :value="d.v" x-text="d.t"></option></template>
            </select>
          </p>

            <button class="btn" type="submit" :class="justDone && 'done'" :disabled="!(minutes>0)">

            </button>
            <p class="log-note" :class="last && 'ok fade-in'" aria-live="polite" x-text="last || 'Hver øving teller, også ti minutter i bilen.'"></p>
          </div>

                    </div>

      </div>

  </div>
</main>

      {m:'Oktober', e:[
        {d:'Tor 2. okt', w:'Øving', t:'19:00'},
        {d:'Lør 4. okt', w:'Opptreden', where:'Grieghallen foyer', t:'14:00', pub:true},
        {d:'Tor 9. okt', w:'Øving', t:'19:00'},
        {d:'Fre 17. okt', w:'Semesterfest', t:''},
      ]},
      {m:'November', e:[
        {d:'Tor 6. nov', w:'Øving', t:'19:00'},
        {d:'Lør 8. nov', w:'Høstkonsert', where:'Universitetsaulaen', t:'18:00', pub:true},
      ]},
      {m:'Desember', e:[
        {d:'Lør 13. des', w:'Julekonsert', where:'Johanneskirken', t:'19:00', pub:true},
      ]},
    ],
    docs:[{t:'Vedtekter', d:'Mars 2024'},{t:'Referat fra årsmøtet', d:'Feb 2026'},{t:'Sangerhåndbok', d:'Aug 2026'}],
    lists:[
      {t:'Hele koret', d:'Beskjeder til alle aktive', on:true},
      {t:'Tenorer', d:'Stemmegruppe', on:true},
      {t:'Konsertnytt', d:'Åpne konserter og billetter', on:false, all:true},
      {t:'Ypp.com.', d:'Tidligere medlemmer', on:false, all:true},
    ],
    events:{
      aktiv:{
        lead:{kind:'Neste øving', day:'Torsdag 2. okt', time:'19:00', title:'«Julekonsert-innspurt»'},
        later:[
          {id:'a1', d:'Lør 4. okt', w:'Opptreden', where:'Grieghallen foyer', t:'14:00'},
          {id:'a2', d:'Tor 9. okt', w:'Øving', t:'19:00'},
          {id:'a3', d:'Fre 17. okt', w:'Semesterfest', t:''},
        ]},
      tidligere:{
        lead:{kind:'Neste opptreden', day:'Lørdag 4. okt', time:'14:00', title:'Grieghallen foyer'},
        later:[
          {id:'t1', d:'Lør 8. nov', w:'Høstkonsert', where:'Universitetsaulaen', t:'18:00'},
          {id:'t2', d:'Lør 13. des', w:'Julekonsert', where:'Johanneskirken', t:'19:00'},
        ]},
    },
    get lead(){ return this.events[this.status].lead },
    get later(){ return this.events[this.status].later },
    get days(){
      const names=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
      const out=[{v:'0',t:'i dag'},{v:'1',t:'i går'}];
      for(let i=2;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); out.push({v:String(i), t:'på '+names[d.getDay()]}); }
      return out;
    },
    get knownCount(){ return this.songs.filter(s=>s.k==='kjent').length },
    get filtered(){
      const q=this.q.trim().toLowerCase();
      return q ? this.songs.filter(s => (s.t+' '+s.g).toLowerCase().includes(q)) : this.songs;
    },

    /* ---------- routing (fake, hash based) ---------- */
    subs(sec){
      const list = this.sections[sec].subs || [];
      return list.filter(s => !(s.activeOnly && this.status==='tidligere') && !(s.roles && !s.roles.some(r => this.roles.includes(r))));
    },
    get sec(){ return this.route.sec },
    get sub(){
      const s = this.route.sec; if(s==='hjem') return null;
      const vis = this.subs(s).filter(x => !x.h);
      return vis.some(x => x.k===this.route.sub) ? this.route.sub : vis[0].k;
    },
    get subTitle(){ const s=this.subs(this.sec).find(x=>x.k===this.sub); return s ? s.t : '' },
    parse(){
      const [a,b] = location.hash.replace(/^#\/?/,'').split('/');
      const sec = this.sections[a] ? a : 'hjem';
      this.route = {sec, sub: sec==='hjem' ? null : (b || null)};
    },
    init(){
      const h = new Date().getHours();
      this.greeting = h<5 ? 'God natt' : h<10 ? 'God morgen' : h<12 ? 'God formiddag' : h<18 ? 'God ettermiddag' : 'God kveld';
      this.parse();
      window.addEventListener('hashchange', () => {
        const prev = this.route.sec + '/' + this.route.sub;
        this.parse(); this.meOpen=false; this.q=''; this.sent=false;
        if(prev === this.route.sec + '/' + this.route.sub && !this.pendingLog) return;
        window.scrollTo(0,0);
        this.$nextTick(() => {
          if(this.pendingLog){ this.pendingLog=false; this.focusLog(); return; }
          const h = [...document.querySelectorAll('.page-h')].find(el => el.offsetParent);
          h && h.focus({preventScroll:true});
        });
      });
    },
    goLog(e){
      this.meOpen = false;
      if(this.sec==='hjem'){ e.preventDefault(); this.focusLog(); }
      else this.pendingLog = true;
    },
    focusLog(){
      if(this.status!=='aktiv') return;
      setTimeout(() => { const m = document.getElementById("min"); m.focus({preventScroll:true}); m.scrollIntoView({block:"center"}); }, 30);
    },

    /* ---------- practice ---------- */
    register(){
      const n = +this.minutes; if(!(n>0)) return;
      const firstToday = !this.logged;
      this.logged = true;
      if(firstToday) this.streak = 7;
      this.week += n;
      const when = this.days.find(d => d.v===this.day).t;
      this.last = `${n} min ${when} er registrert. ${this.streak} dager på rad.`;
      this.justDone = true; this.bumped = false;
      this.$nextTick(() => { this.bumped = true; });
      clearTimeout(this._t); this._t = setTimeout(() => { this.justDone=false; this.bumped=false; }, 2200);
    },
    knowLabel(k){ return this.know.find(o=>o.v===k).t },

    /* ---------- toneangiver ---------- */
    play(s){
      this.playing = s.id;
      try{
        this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
        const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type='triangle'; o.frequency.value = NOTE[s.key] || 220;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.04); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
        o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t+1.45);
      }catch(_){}
      clearTimeout(this._p); this._p = setTimeout(() => { if(this.playing===s.id) this.playing=null; }, 1450);
    },

    /* ---------- menus ---------- */
    onEsc(){
      if(this.meOpen){ this.meOpen=false; this.$refs.meBtn.focus(); return; }
      if(this.demoOpen){ this.demoOpen=false; }
    },
    toggleMe(){ this.meOpen ? (this.meOpen=false) : this.openMe() },
    openMe(){
      this.meOpen = true;
      this.$nextTick(() => this.$refs.meMenu.querySelector('a').focus());
    },
    moveMenu(d){
      const items = [...this.$refs.meMenu.querySelectorAll('a')];
      const i = items.indexOf(document.activeElement);
      items[(i + d + items.length) % items.length].focus();
    },
  }
}
</script>
</body>
